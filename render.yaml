# render.yaml — Render deployment configuration
# Place this file in the ROOT of your GitHub repository
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: banana-disease-api
    runtime: python
    rootDir: backend           # folder inside your repo that contains main.py
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    plan: free                 # upgrade to "starter" for more RAM (recommended for TF models)

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

    # Health check — Render will ping this to confirm the app is live
    healthCheckPath: /health
